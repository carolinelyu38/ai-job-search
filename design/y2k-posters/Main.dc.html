<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik+Mono+One&family=Zen+Dots&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #4a0d2e; }
    a { color: #ff2d9b; } a:hover { color: #ffd0e8; }
    .sticker { background: #fff8ee; color: #1a0810; border: 5px solid #fff8ee; outline: 3px solid #1a0810; box-shadow: 6px 8px 0 #1a0810; }
    .tape { font-family: 'Zen Dots', 'Rubik Mono One', Impact, sans-serif; letter-spacing: 2px; white-space: nowrap; overflow: hidden; }
    .callout { position: absolute; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-weight: 900; font-size: 18px; line-height: 1; color: #1a0810; background: #fff8ee; padding: 8px 12px; border: 3px solid #1a0810; box-shadow: 4px 4px 0 #ff2d9b; }
  </style>
</helmet>
<div style="position: relative; width: 1000px; height: 1414px; overflow: hidden; background: #4a0d2e; font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;">

  <!-- hot pink flood + halftone -->
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 58% 42%, #ff2d9b 0px, #ff2d9b 300px, #4a0d2e 640px);"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(circle, #4a0d2e 1.7px, transparent 2.4px) 0 0 / 12px 12px; -webkit-mask-image: radial-gradient(circle at 58% 42%, transparent 180px, #000 560px); mask-image: radial-gradient(circle at 58% 42%, transparent 180px, #000 560px);"></div>

  <!-- cream burst behind the figure -->
  <svg style="position: absolute; left: 130px; top: 120px;" width="820" height="900" viewBox="0 0 820 900">
    <polygon points="410,20 470,250 640,90 560,300 800,270 600,420 810,540 570,520 690,760 480,600 430,880 380,620 200,800 300,560 40,600 250,430 30,290 280,320 160,80 350,250" fill="#f6ead8"/>
    <polygon points="410,20 470,250 640,90 560,300 800,270 600,420 810,540 570,520 690,760 480,600 430,880 380,620 200,800 300,560 40,600 250,430 30,290 280,320 160,80 350,250" fill="none" stroke="#1a0810" stroke-width="6"/>
  </svg>

  <!-- vertical title -->
  <div style="position: absolute; left: -30px; top: 1000px; transform: rotate(-90deg); transform-origin: left top; font-family: 'Rubik Mono One', Impact, sans-serif; font-size: 150px; line-height: 1; color: #fff8ee; -webkit-text-stroke: 4px #1a0810; letter-spacing: -6px;">PEARL</div>
  <div style="position: absolute; left: 44px; top: 70px; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-weight: 900; font-size: 150px; line-height: 0.95; color: #1a0810; text-shadow: 8px 8px 0 #ff2d9b, 8px 8px 0 #ff2d9b, 12px 12px 0 #fff8ee;">珍<br>珠</div>

  <!-- page number -->
  <div style="position: absolute; right: 40px; top: 44px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
    <div style="font-family: 'Zen Dots', Impact, sans-serif; font-size: 96px; line-height: 1; color: #fff8ee; -webkit-text-stroke: 3px #1a0810;">01</div>
    <div style="font-family: 'Zen Dots', Impact, sans-serif; font-size: 16px; letter-spacing: 6px; color: #fff8ee;">/ 04 · WASTELAND</div>
  </div>

  <!-- MAIN FIGURE: outfit A (veil + pearls + fur) -->
  <svg style="position: absolute; left: 300px; top: 150px;" width="450" height="960" viewBox="0 0 300 640">
    <defs>
      <filter id="furA" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <path d="M95 440 L80 632 L138 632 L146 470 Z" fill="#2b0a1c"/>
    <path d="M154 470 L162 632 L220 632 L205 440 Z" fill="#2b0a1c"/>
    <path d="M70 250 C40 330 28 400 34 484 L266 484 C272 400 260 330 230 250 Z" fill="#efe4d3" filter="url(#furA)"/>
    <ellipse cx="82" cy="332" rx="22" ry="34" fill="#3b2a2a"/>
    <ellipse cx="238" cy="402" rx="26" ry="30" fill="#3b2a2a"/>
    <ellipse cx="62" cy="442" rx="18" ry="24" fill="#3b2a2a"/>
    <ellipse cx="216" cy="298" rx="16" ry="22" fill="#3b2a2a"/>
    <path d="M115 250 L100 480 L200 480 L185 250 Z" fill="#1a0810"/>
    <path d="M98 356 L202 356 L206 382 L94 382 Z" fill="#ff2d9b"/>
    <path d="M150 30 C110 60 70 140 60 250 C50 300 46 340 52 384 L110 332 L150 352 L190 332 L248 384 C254 340 250 300 240 250 C230 140 190 60 150 30 Z" fill="#f2a493"/>
    <path d="M100 140 C90 220 84 300 90 370 M200 140 C210 220 216 300 210 370" stroke="#d47c6c" stroke-width="3" fill="none"/>
    <ellipse cx="150" cy="150" rx="36" ry="48" fill="#c98f6c"/>
    <path d="M122 140 h20 M158 140 h20" stroke="#2b0a1c" stroke-width="7" stroke-linecap="round"/>
    <path d="M140 174 q10 8 20 0" stroke="#7a3b2f" stroke-width="3" fill="none"/>
    <path d="M120 60 C60 160 60 260 90 384" stroke="#fff6e6" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="0 13"/>
    <path d="M180 60 C240 160 240 260 210 384" stroke="#fff6e6" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="0 13"/>
    <path d="M100 210 C140 260 160 260 200 210" stroke="#fff6e6" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="0 13"/>
    <path d="M80 300 C130 350 170 350 220 300" stroke="#fff6e6" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="0 13"/>
    <rect x="146" y="36" width="8" height="34" fill="#f3d27a"/>
    <rect x="134" y="46" width="32" height="8" fill="#f3d27a"/>
  </svg>

  <!-- callouts around outfit A -->
  <div class="callout" style="left: 690px; top: 300px;">防风沙</div>
  <svg style="position: absolute; left: 600px; top: 300px;" width="100" height="40" viewBox="0 0 100 40"><path d="M96 14 L10 30" stroke="#1a0810" stroke-width="3"/><circle cx="10" cy="30" r="5" fill="#1a0810"/></svg>
  <div class="callout" style="left: 700px; top: 610px; width: 150px; line-height: 1.25;">废弃兽皮毛<br>改造 · 非常保暖</div>
  <svg style="position: absolute; left: 640px; top: 620px;" width="70" height="40" viewBox="0 0 70 40"><path d="M66 12 L6 30" stroke="#1a0810" stroke-width="3"/><circle cx="6" cy="30" r="5" fill="#1a0810"/></svg>
  <div class="callout" style="left: 170px; top: 470px; width: 130px; line-height: 1.25;">末世前大牌<br>打底</div>
  <svg style="position: absolute; left: 300px; top: 470px;" width="130" height="60" viewBox="0 0 130 60"><path d="M4 20 L120 52" stroke="#1a0810" stroke-width="3"/><circle cx="120" cy="52" r="5" fill="#1a0810"/></svg>
  <div class="callout" style="left: 130px; top: 760px; width: 150px; line-height: 1.25;">营地内依旧<br>需要简单防护</div>

  <!-- pearl string crossing the page -->
  <svg style="position: absolute; left: 0; top: 0;" width="1000" height="1414" viewBox="0 0 1000 1414">
    <path d="M-20 1000 C200 1120 380 900 560 1060 C740 1220 900 1080 1030 1160" stroke="#1a0810" stroke-width="18" fill="none" stroke-linecap="round" stroke-dasharray="0 24"/>
    <path d="M-20 1000 C200 1120 380 900 560 1060 C740 1220 900 1080 1030 1160" stroke="#fff6e6" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="0 24"/>
    <path d="M840 60 C846 90 852 96 882 102 C852 108 846 114 840 144 C834 114 828 108 798 102 C828 96 834 90 840 60 Z" fill="#fff8ee" stroke="#1a0810" stroke-width="3"/>
    <path d="M120 690 C124 708 128 712 146 716 C128 720 124 724 120 742 C116 724 112 720 94 716 C112 712 116 708 120 690 Z" fill="#fff8ee" stroke="#1a0810" stroke-width="3"/>
    <path d="M930 760 C936 790 942 796 972 802 C942 808 936 814 930 844 C924 814 918 808 888 802 C918 796 924 790 930 760 Z" fill="#ff2d9b" stroke="#1a0810" stroke-width="3"/>
  </svg>

  <!-- tape strip -->
  <div class="tape" style="position: absolute; left: -60px; top: 1000px; width: 1200px; transform: rotate(-7deg); background: #1a0810; color: #fff8ee; font-size: 22px; padding: 10px 0; border-top: 3px solid #fff8ee; border-bottom: 3px solid #fff8ee;">末世前的珠宝 就这样浪费 ✦ PRE-WAR JEWELRY, WASTED LIKE THIS ✦ 末世前的珠宝 就这样浪费 ✦ PRE-WAR JEWELRY, WASTED LIKE THIS ✦</div>

  <!-- outfit B sticker: beige cloak -->
  <div class="sticker" style="position: absolute; left: 60px; top: 1040px; width: 250px; height: 300px; transform: rotate(4deg); overflow: hidden; background: #f2a493;">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle, #1a0810 1.4px, transparent 2px) 0 0 / 10px 10px; opacity: 0.35;"></div>
    <svg style="position: absolute; left: 30px; top: -10px;" width="190" height="405" viewBox="0 0 300 640">
      <defs>
        <filter id="furB" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <path d="M100 420 L90 632 L210 632 L200 420 Z" fill="#efe4d3" filter="url(#furB)"/>
      <ellipse cx="120" cy="500" rx="18" ry="26" fill="#3b2a2a"/>
      <ellipse cx="185" cy="580" rx="20" ry="22" fill="#3b2a2a"/>
      <rect x="112" y="250" width="76" height="180" fill="#1a0810"/>
      <path d="M112 300 h76 M112 340 h76 M112 380 h76" stroke="#5a4a4a" stroke-width="6"/>
      <path d="M150 40 C100 60 80 130 80 200 L20 630 L104 630 L112 430 L188 430 L196 630 L280 630 L220 200 C220 130 200 60 150 40 Z" fill="#cdb78f"/>
      <path d="M92 220 C70 350 60 480 48 620 M208 220 C230 350 240 480 252 620" stroke="#a9946f" stroke-width="4" fill="none"/>
      <ellipse cx="150" cy="150" rx="46" ry="62" fill="#efe4d3"/>
      <ellipse cx="150" cy="176" rx="28" ry="26" fill="#c98f6c"/>
      <rect x="108" y="122" width="84" height="28" rx="8" fill="#0d0508"/>
    </svg>
    <div style="position: absolute; left: 10px; bottom: 10px; font-family: 'Zen Dots', Impact, sans-serif; font-size: 14px; letter-spacing: 3px; color: #1a0810;">LOOK 02 · 防风材料</div>
  </div>

  <!-- price tag sticker -->
  <div class="sticker" style="position: absolute; left: 640px; top: 1090px; width: 260px; padding: 14px 16px; transform: rotate(-5deg); display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Rubik Mono One', Impact, sans-serif; font-size: 26px; line-height: 1; color: #1a0810;">PRE-WAR<br>COUTURE</div>
    <div style="font-family: 'Zen Dots', Impact, sans-serif; font-size: 16px; letter-spacing: 3px; color: #ff2d9b; background: #1a0810; padding: 6px 8px; align-self: flex-start;">¥ EXPIRED</div>
    <div style="height: 38px; background: repeating-linear-gradient(90deg, #1a0810 0 2px, transparent 2px 5px, #1a0810 5px 6px, transparent 6px 10px, #1a0810 10px 13px, transparent 13px 15px, #1a0810 15px 16px, transparent 16px 20px);"></div>
    <div style="font-family: 'Noto Sans SC', sans-serif; font-weight: 500; font-size: 12px; color: #1a0810; letter-spacing: 1px;">皮草 · 珍珠 · 十字架 · 兽皮改造</div>
  </div>

  <!-- footer -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #1a0810; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-family: 'Zen Dots', Impact, sans-serif; font-size: 14px; letter-spacing: 5px; color: #fff8ee;">
    <span>末世废土 · UNDERGROUND STREET</span>
    <span>CHARACTER 01 · 珍珠 PEARL</span>
  </div>

  <!-- grain -->
  <svg style="position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.16; pointer-events: none;" width="1000" height="1414">
    <filter id="grainA"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1000" height="1414" filter="url(#grainA)"/>
  </svg>
</div>
</x-dc>
</body>
</html>
