<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Zen+Dots&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #1a2cff; }
    a { color: #c6ff00; } a:hover { color: #ffffff; }
    .sticker { background: #ffffff; color: #0a0a12; border: 5px solid #ffffff; outline: 3px solid #0a0a12; box-shadow: 6px 8px 0 #0a0a12; }
    .callout { position: absolute; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-weight: 900; font-size: 18px; line-height: 1.25; color: #0a0a12; background: #c6ff00; padding: 8px 12px; border: 3px solid #0a0a12; box-shadow: 4px 4px 0 #ffffff; }
  </style>
</helmet>
<div style="position: relative; width: 1000px; height: 1414px; overflow: hidden; background: #1a2cff; font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;">

  <!-- acid diagonal panel + black band -->
  <div style="position: absolute; left: 0; top: 0; width: 1000px; height: 1414px; background: #c6ff00; clip-path: polygon(0 62%, 100% 30%, 100% 100%, 0 100%);"></div>
  <div style="position: absolute; left: 0; top: 0; width: 1000px; height: 1414px; background: #0a0a12; clip-path: polygon(0 66%, 100% 34%, 100% 40%, 0 72%);"></div>
  <!-- halftone corner -->
  <div style="position: absolute; right: 0; top: 0; width: 700px; height: 700px; background: radial-gradient(circle, #0a0a12 1.6px, transparent 2.3px) 0 0 / 12px 12px; -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 100px, transparent 520px); mask-image: radial-gradient(circle at 100% 0%, #000 100px, transparent 520px); opacity: 0.55;"></div>

  <!-- radar rings -->
  <svg style="position: absolute; left: 380px; top: 110px;" width="700" height="700" viewBox="0 0 700 700">
    <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9">
      <circle cx="350" cy="350" r="120"/><circle cx="350" cy="350" r="210"/><circle cx="350" cy="350" r="300"/>
      <path d="M350 40 V660 M40 350 H660"/>
    </g>
    <path d="M350 350 L350 50 A300 300 0 0 1 640 300 Z" fill="#c6ff00" opacity="0.55"/>
    <circle cx="470" cy="230" r="10" fill="#ffffff" stroke="#0a0a12" stroke-width="3"/>
    <circle cx="410" cy="410" r="10" fill="#ffffff" stroke="#0a0a12" stroke-width="3"/>
  </svg>

  <!-- big title -->
  <div style="position: absolute; left: 40px; top: 60px; font-family: 'Bungee', Impact, sans-serif; font-size: 118px; line-height: 0.92; color: #ffffff; -webkit-text-stroke: 3px #0a0a12; text-shadow: 10px 10px 0 #0a0a12;">NO<br>EXCESS<br>ARMOR</div>
  <div style="position: absolute; left: 44px; top: 430px; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-weight: 900; font-size: 40px; line-height: 1.2; color: #c6ff00; background: #0a0a12; padding: 6px 18px; display: inline-block;">指挥的角色 · 无过多防护</div>

  <!-- page number -->
  <div style="position: absolute; right: 40px; top: 44px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
    <div style="font-family: 'Zen Dots', Impact, sans-serif; font-size: 96px; line-height: 1; color: #c6ff00; -webkit-text-stroke: 3px #0a0a12;">03</div>
    <div style="font-family: 'Zen Dots', Impact, sans-serif; font-size: 16px; letter-spacing: 6px; color: #ffffff;">/ 04 · WASTELAND</div>
  </div>

  <!-- MAIN FIGURE: outfit A (grey hair, visor, textured shirt, fur gloves, jeans) -->
  <svg style="position: absolute; left: 470px; top: 330px;" width="470" height="1000" viewBox="0 0 300 640">
    <defs>
      <filter id="furC" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="5" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <pattern id="tex" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.6" fill="#55555c"/></pattern>
    </defs>
    <rect x="84" y="570" width="56" height="60" rx="6" fill="#0a0a12"/>
    <rect x="160" y="570" width="56" height="60" rx="6" fill="#0a0a12"/>
    <path d="M86 420 L78 582 L142 582 L150 450 L158 582 L222 582 L214 420 Z" fill="#3f5f9a"/>
    <path d="M112 440 L106 570 M188 440 L194 570" stroke="#5d7fbf" stroke-width="3"/>
    <rect x="34" y="240" width="42" height="190" rx="12" fill="#2a2a2e" transform="rotate(9 55 240)"/>
    <rect x="224" y="240" width="42" height="190" rx="12" fill="#2a2a2e" transform="rotate(-9 245 240)"/>
    <circle cx="44" cy="446" r="30" fill="#6a6a72" filter="url(#furC)"/>
    <circle cx="256" cy="446" r="30" fill="#6a6a72" filter="url(#furC)"/>
    <path d="M76 232 L64 430 L236 430 L224 232 Z" fill="#2a2a2e"/>
    <path d="M76 232 L64 430 L236 430 L224 232 Z" fill="url(#tex)"/>
    <ellipse cx="150" cy="236" rx="66" ry="20" fill="#5a5a62" filter="url(#furC)"/>
    <circle cx="150" cy="272" r="6" fill="#eeeeee"/><circle cx="150" cy="310" r="6" fill="#eeeeee"/><circle cx="150" cy="348" r="6" fill="#eeeeee"/><circle cx="150" cy="386" r="6" fill="#eeeeee"/>
    <ellipse cx="150" cy="158" rx="40" ry="52" fill="#c98f6c"/>
    <path d="M96 150 C88 80 128 48 150 50 C176 48 214 80 206 150 L204 200 L196 182 L190 214 L180 178 C170 168 160 170 150 172 C138 170 126 168 118 180 L110 214 L104 184 L98 204 Z" fill="#cfcfd4"/>
    <path d="M122 92 C132 116 142 126 150 124 M178 92 C170 116 162 126 154 124 M150 56 V120" stroke="#9a9aa2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M198 120 C220 150 226 190 218 230" stroke="#cfcfd4" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="102" y="130" width="96" height="28" rx="9" fill="#050508"/>
    <path d="M112 138 h30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M136 186 q14 8 28 0" stroke="#7a3b2f" stroke-width="3" fill="none"/>
  </svg>

  <!-- arrows -->
  <svg style="position: absolute; left: 40px; top: 560px;" width="420" height="120" viewBox="0 0 420 120">
    <path d="M10 60 H330" stroke="#0a0a12" stroke-width="14"/>
    <path d="M300 14 L400 60 L300 106 Z" fill="#0a0a12"/>
    <path d="M10 60 H330" stroke="#ffffff" stroke-width="6"/>
  </svg>

  <!-- callouts -->
  <div class="callout" style="left: 620px; top: 300px;">特立独行</div>
  <div class="callout" style="left: 760px; top: 1000px; width: 120px;">毛毛手套<br>保暖</div>
  <svg style="position: absolute; left: 730px; top: 990px;" width="60" height="40" viewBox="0 0 60 40"><path d="M56 22 L8 8" stroke="#0a0a12" stroke-width="3"/><circle cx="8" cy="8" r="5" fill="#0a0a12"/></svg>
  <div class="callout" style="left: 380px; top: 720px; width: 130px;">领示加厚<br>绒绒</div>
  <svg style="position: absolute; left: 510px; top: 700px;" width="120" height="60" viewBox="0 0 120 60"><path d="M4 40 L110 14" stroke="#0a0a12" stroke-width="3"/><circle cx="110" cy="14" r="5" fill="#0a0a12"/></svg>

  <!-- sector stamp -->
  <div style="position: absolute; left: 40px; top: 760px; transform: rotate(-6deg); border: 5px solid #0a0a12; padding: 10px 16px; font-family: 'Zen Dots', Impact, sans-serif; font-size: 24px; letter-spacing: 4px; color: #0a0a12; line-height: 1.2;">SECTOR 03<br>CMD · GREY</div>

  <!-- outfit B sticker: blue jacket with straps -->
  <div class="sticker" style="position: absolute; left: 60px; top: 960px; width: 260px; height: 320px; transform: rotate(3deg); overflow: hidden; background: #1a2cff;">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle, #0a0a12 1.4px, transparent 2px) 0 0 / 10px 10px; opacity: 0.4;"></div>
    <svg style="position: absolute; left: 30px; top: -4px;" width="200" height="426" viewBox="0 0 300 640">
      <rect x="86" y="560" width="56" height="66" rx="6" fill="#0a0a12"/>
      <rect x="158" y="560" width="56" height="66" rx="6" fill="#0a0a12"/>
      <path d="M84 430 L74 572 L144 572 L150 470 L156 572 L226 572 L216 430 Z" fill="#161620"/>
      <rect x="120" y="470" width="24" height="40" fill="#0a0a12" stroke="#444" stroke-width="3"/>
      <rect x="30" y="240" width="44" height="190" rx="12" fill="#2438d6" transform="rotate(8 52 240)"/>
      <rect x="226" y="240" width="44" height="190" rx="12" fill="#2438d6" transform="rotate(-8 248 240)"/>
      <path d="M70 230 L58 440 L242 440 L230 230 Z" fill="#2438d6"/>
      <rect x="70" y="230" width="52" height="16" fill="#0a0a12"/>
      <rect x="178" y="230" width="52" height="16" fill="#0a0a12"/>
      <path d="M96 240 L204 440 M204 240 L96 440" stroke="#0a0a12" stroke-width="16"/>
      <rect x="140" y="330" width="20" height="20" fill="#cfcfd4" stroke="#0a0a12" stroke-width="3"/>
      <path d="M58 400 H242" stroke="#0a0a12" stroke-width="14"/>
      <path d="M150 40 C100 50 84 100 86 180 L94 236 L206 236 L214 180 C216 100 200 50 150 40 Z" fill="#0a0a12"/>
      <ellipse cx="150" cy="150" rx="38" ry="50" fill="#c98f6c"/>
      <path d="M112 160 C120 200 180 200 188 160 L188 186 C176 214 124 214 112 186 Z" fill="#0a0a12"/>
      <rect x="112" y="124" width="76" height="24" rx="8" fill="#050508" stroke="#666" stroke-width="2"/>
    </svg>
    <div style="position: absolute; left: 10px; bottom: 10px; font-family: 'Zen Dots', Impact, sans-serif; font-size: 14px; letter-spacing: 3px; color: #ffffff;">LOOK 02 · 加厚防风牛仔</div>
  </div>
  <div class="callout" style="left: 340px; top: 1180px; width: 140px;">作战裤<br>粗布 · 内置皮草</div>

  <!-- chrome stars -->
  <svg style="position: absolute; left: 0; top: 0;" width="1000" height="1414" viewBox="0 0 1000 1414">
    <path d="M880 700 C888 740 896 748 936 756 C896 764 888 772 880 812 C872 772 864 764 824 756 C864 748 872 740 880 700 Z" fill="#ffffff" stroke="#0a0a12" stroke-width="3"/>
    <path d="M420 520 C425 545 430 550 455 555 C430 560 425 565 420 590 C415 565 410 560 385 555 C410 550 415 545 420 520 Z" fill="#c6ff00" stroke="#0a0a12" stroke-width="3"/>
    <path d="M560 1300 C566 1330 572 1336 602 1342 C572 1348 566 1354 560 1384 C554 1354 548 1348 518 1342 C548 1336 554 1330 560 1300 Z" fill="#ffffff" stroke="#0a0a12" stroke-width="3"/>
  </svg>

  <!-- footer -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #0a0a12; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-family: 'Zen Dots', Impact, sans-serif; font-size: 14px; letter-spacing: 5px; color: #c6ff00;">
    <span>末世废土 · UNDERGROUND STREET</span>
    <span>CHARACTER 03 · 指挥 COMMAND</span>
  </div>

  <!-- grain -->
  <svg style="position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.14; pointer-events: none;" width="1000" height="1414">
    <filter id="grainC"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1000" height="1414" filter="url(#grainC)"/>
  </svg>
</div>
</x-dc>
</body>
</html>
